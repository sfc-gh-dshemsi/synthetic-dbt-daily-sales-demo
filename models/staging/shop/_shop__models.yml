version: 2

models:
  - name: stg_shop__orders
    description: Cleaned orders, one row per order_id (latest load wins), with normalized client id and status.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_shop__clients')
              field: client_id
      - name: order_date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
          - assert_positive_value
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'refunded']
  - name: stg_shop__clients
    description: Typed synthetic clients, one row per client, current tier only.
    columns:
      - name: client_id
        data_tests:
          - not_null
          - unique
      - name: tier
        data_tests:
          - accepted_values:
              values: ['standard', 'gold']
