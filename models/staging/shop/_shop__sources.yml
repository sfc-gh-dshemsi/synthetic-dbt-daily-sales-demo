version: 2

sources:
  - name: shop
    description: Synthetic raw tables for a fictional marketplace, loaded by setup/synthetic_orders.sql.
    database: SYNTHETIC_DBT_DAILY_SALES_DEMO
    schema: RAW
    tables:
      - name: orders
        description: Raw order extract as received. Can contain re-loaded duplicates, inconsistent casing, cancelled orders, and refunds.
        columns:
          - name: order_id
            data_tests:
              - not_null
              # Raw data is known to contain re-loaded duplicates. Warn, don't fail:
              # stg_shop__orders removes them, and its own unique test is strict.
              - unique:
                  config:
                    severity: warn
      - name: clients
        description: One row per client with its current tier. Tier changes overwrite the row; snapshots/hist_clients.sql keeps the history.
        columns:
          - name: client_id
            data_tests:
              - not_null
              - unique
